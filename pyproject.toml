[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-planning-engine"
version = "0.1.0"
description = "Constraint-based academic course and graduation planner"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["academic-planning", "constraint-programming", "fastapi", "or-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115,<0.120",
    "ortools>=9.10,<10",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.12,<1",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
academic-planner-demo = "academic_planner.__main__:main"
academic-planner-seed = "academic_planner.database.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_planner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
