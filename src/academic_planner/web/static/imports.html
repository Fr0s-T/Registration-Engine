<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Curriculum Import</title><link rel="stylesheet" href="/static/admin.css"></head>
<body><header><h1>Academic Planning Engine</h1><div id="nav"></div></header><main>
<div id="message" class="hidden"></div>
<section class="card"><h2>Complete curriculum replacement</h2><p>Upload and validate the complete source first. Nothing is deleted during preview. Confirmation replaces only the selected curriculum in one database transaction; manual catalog corrections in that curriculum are intentionally discarded.</p>
<form id="upload"><label>Curriculum <select name="curriculum_version"><option>OLD</option><option>NEW</option></select></label><label>Source file <input name="file" type="file" required accept=".xlsx,.pdf"></label><button class="primary">Parse and preview</button></form></section>
<section id="preview"></section><section id="history"></section>
</main><script type="module">
import{api,nav,esc,message}from'/static/admin.js';document.querySelector('#nav').innerHTML=nav('imports');
let preview=null;
const validation=v=>`<h3>Validation</h3><p>${v.publishable?'Ready for replacement':'Publication blocked'} · ${v.fatal_errors.length} fatal · ${v.warnings.length} warning(s)</p>${[...v.fatal_errors,...v.warnings].map(i=>`<p class="small"><strong>${esc(i.severity)}</strong> ${esc(i.message)}${i.source?` (${esc(i.source)})`:''}</p>`).join('')}<h3>Term credit totals</h3><p>${Object.entries(v.term_totals).map(([k,n])=>`${esc(k)}: ${n}`).join(' · ')}</p>`;
function show(p){preview=p;document.querySelector('#preview').innerHTML=`<article class="card"><h2>${esc(p.curriculum_version)} CURRICULUM IMPORT</h2><p>Source: ${esc(p.source)}</p><p><strong>${p.courses_parsed}</strong> courses · <strong>${p.prerequisite_rules}</strong> prerequisite rules (${p.prerequisite_links} links) · <strong>${p.curriculum_credits}</strong> ECTS · <strong>${p.requirements}</strong> requirements</p><h3>Replacement scope</h3><p>${p.existing_courses_to_replace} existing ${esc(p.curriculum_version)} courses, their prerequisites, requirements, and lab relationships. The other curriculum and engine settings are preserved. Referencing equivalencies or timetable offerings are invalidated and reported.</p>${validation(p.validation)}<p><strong>${esc(p.confirmation)}</strong></p><button id="replace" class="primary" ${p.validation.publishable?'':'disabled'}>Replace ${esc(p.curriculum_version)} Curriculum</button> <button id="cancel">Cancel</button></article>`;document.querySelector('#cancel').onclick=()=>{preview=null;document.querySelector('#preview').innerHTML=''};if(p.validation.publishable)document.querySelector('#replace').onclick=replace;}
async function replace(){if(!preview||!confirm(preview.confirmation))return;try{const r=await api(`/api/admin/imports/${preview.batch_id}/confirm`,{method:'POST',body:JSON.stringify({confirm_replace:true})});message(`${r.message}. ${r.courses_inserted} courses and ${r.prerequisites_inserted} prerequisite links inserted; ${r.equivalencies_invalidated} equivalencies, ${r.matching_decisions_invalidated} matching decisions, and ${r.offerings_invalidated} timetable offerings invalidated.`);document.querySelector('#preview').innerHTML='';await history()}catch(e){message(e.message,true)}}
document.querySelector('#upload').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target);try{const r=await fetch('/api/admin/imports/preview',{method:'POST',body:form});if(!r.ok){let d;try{d=(await r.json()).detail}catch{d=await r.text()}throw new Error(typeof d==='string'?d:JSON.stringify(d))}show(await r.json())}catch(x){message(x.message,true)}};
async function history(){const d=await api('/api/admin/imports');document.querySelector('#history').innerHTML=`<h2>Import sources</h2>`+(d.documents.map(doc=>`<article class="card"><h3>${esc(doc.filename)}</h3><span class="badge unverified">${esc(doc.kind)} · ${esc(doc.status)}</span><p>${esc(doc.notes)}</p>${d.batches.filter(b=>b.source_document_id===doc.id).map(b=>`<p>Batch ${b.id}: ${esc(b.status)}</p>`).join('')}</article>`).join('')||'<p>No curriculum source has been uploaded.</p>')}
history().catch(e=>message(e.message,true));
</script></body></html>
